<!-- meta -- seo -->
{% if page.title != '~perplexedtheta' %}
    <title>~perplexedtheta | {{ page.title }}</title>
    <meta name="og:title" content="~perplexedtheta | {{ page.title }}">
{% else %}
    <title>~perplexedtheta</title>
    <meta name="og:title" content="~perplexedtheta">
{% endif %}
{% if page.description %}
    <meta name="description" content="{{ page.description }}">
    <meta name="og:description" content="{{ page.description }}">
{% else %}
    <meta name="description" content="The personal webpages of ~perplexedtheta, a full-stack developer based in the UK">
    <meta name="og:description" content="The personal webpages of ~perplexedtheta, a full-stack developer based in the UK">
{% endif %}
<!-- meta -- indexers -->
<meta name="robots" content="index,follow" />
<!-- meta - favicons -->
<link rel="apple-touch-icon" sizes="60x60" href="{{- 'include/favicons/apple-touch-icon.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{- 'include/favicons/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{- 'include/favicons/favicon-16x16.png' | relative_url }}">
<link rel="manifest" href="{{- 'include/favicons/site.webmanifest' | relative_url }}">
<link rel="mask-icon" href="{{- 'include/favicons/safari-pinned-tab.svg' | relative_url }}" color="#5bbad5">
<meta name="msapplication-TileColor" content="#2d89ef">
<meta name="theme-color" content="#ffffff">
<!-- meta -- renderer -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
